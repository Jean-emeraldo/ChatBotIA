name: bolo_ai
description: "Application Flutter IA : dashboard, messages, tâches et sauvegardes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  uuid: ^4.3.3
  font_awesome_flutter: ^10.7.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  assets:
    - assets/a.jpeg
    - assets/
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/a.jpeg"
